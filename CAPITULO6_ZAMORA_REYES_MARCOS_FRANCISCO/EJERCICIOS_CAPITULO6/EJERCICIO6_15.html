<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Ejercicio 6.15</title>
    <script>
        // a) Usando una instrucción document.writeln
        document.writeln("<h1>Inciso A</h1>");
        document.writeln("<p>1 2 3 4</p>");

        // b) Usando cuatro instrucciones document.write
        document.writeln("<h1>Inciso B</h1><p>");
        document.write("1 ");
        document.write("2 ");
        document.write("3 ");
        document.write("4</p>");
    </script>
</head>
