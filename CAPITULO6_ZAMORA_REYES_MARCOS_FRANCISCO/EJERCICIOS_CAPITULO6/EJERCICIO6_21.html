<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Ejercicio 6.21</title>
    <script>
        var numero = parseInt(window.prompt("Escriba un entero para verificar si es par o impar:", "0"));

        if (numero % 2 == 0) {
            document.writeln("<h1>El número " + numero + " es Par.</h1>");
        }
        if (numero % 2 != 0) {
            document.writeln("<h1>El número " + numero + " es Impar.</h1>");
        }
    </script>
</head>
<body></body>
</html>
