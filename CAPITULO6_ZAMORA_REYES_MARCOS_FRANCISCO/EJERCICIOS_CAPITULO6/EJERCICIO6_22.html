<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Ejercicio 6.22</title>
    <script>
        var n1 = parseInt(window.prompt("Escriba el primer entero:", "0"));
        var n2 = parseInt(window.prompt("Escriba el segundo entero:", "0"));

        if (n1 % n2 == 0) {
            document.writeln("<h1>" + n1 + " es múltiplo de " + n2 + ".</h1>");
        }
        if (n1 % n2 != 0) {
            document.writeln("<h1>" + n1 + " NO es múltiplo de " + n2 + ".</h1>");
        }
    </script>
</head>
<body></body>
</html>
