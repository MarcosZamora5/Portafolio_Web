<!-- Ejercicio 16 -->

<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Ejercicio 6.16</title>
    <script>
        var num1 = parseInt(window.prompt("Escriba el primer número:", "0"));
        var num2 = parseInt(window.prompt("Escriba el segundo número:", "0"));

        document.writeln("<h1>Suma: " + (num1 + num2) + "</h1>");
        document.writeln("<h1>Producto: " + (num1 * num2) + "</h1>");
        document.writeln("<h1>Diferencia: " + (num1 - num2) + "</h1>");
        document.writeln("<h1>Cociente: " + (num1 / num2) + "</h1>");
    </script>
</head>
<body></body>
</html>
