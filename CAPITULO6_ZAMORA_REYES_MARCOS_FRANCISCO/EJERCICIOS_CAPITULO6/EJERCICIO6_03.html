<!DOCTYPE html>
<!-- Ejercicio 6.3: Tareas varias de JavaScript -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Ejercicio 6.3</title>
      <script>
         // a) Declare las variables c, estaEsUnaVariable, q76354 y numero.
         var c, estaEsUnaVariable, q76354, numero;

         // b) Muestre un diálogo que pida al usuario que escriba un entero.
         // Lo guardamos en valorCadena para usarlo en el inciso c.
         var valorCadena = window.prompt( "Escriba un entero", "0" );

         // c) Convierta una cadena en un entero y almacene el valor en edad.
         var edad = parseInt( valorCadena );

         // Asignamos el valor que ingresaste a 'numero' para probar el inciso d.
         numero = edad;

         // d) Si la variable numero no es igual a 7, muestre un mensaje.
         if ( numero != 7 )
            window.alert( "La variable numero no es igual a 7" );

         // e) Produzca una línea de texto de HTML5.
         document.writeln( "<h1>Esto es JavaScript</h1>" );
      </script>
   </head><body></body>
</html>
