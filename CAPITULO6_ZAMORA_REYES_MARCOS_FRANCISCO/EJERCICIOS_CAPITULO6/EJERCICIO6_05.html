<!DOCTYPE html>
<html>
   <head>
      <meta charset = "utf-8">
      <title>Soluci&oacute;n 6</title>
      <script>
         // a) Calcula el producto de tres enteros
         
         // b) Declare las variables x, y, z y resultado
         var x, y, z, resultado;
         
         // c) Declare las variables xVal, yVal y zVal
         var xVal, yVal, zVal;

         // d) Pida al usuario que introduzca el primer valor
         xVal = window.prompt( "Escriba el primer entero:", "0" );

         // e) Pida al usuario que introduzca el segundo valor
         yVal = window.prompt( "Escriba el segundo entero:", "0" );

         // f) Pida al usuario que introduzca el tercer valor
         zVal = window.prompt( "Escriba el tercer entero:", "0" );

         // g) Convierta la cadena xVal en un entero
         x = parseInt( xVal );

         // h) Convierta la cadena yVal en un entero
         y = parseInt( yVal );

         // i) Convierta la cadena zVal en un entero
         z = parseInt( zVal );

         // j) Calcule el producto de los tres enteros
         resultado = x * y * z;

         // k) Escriba una línea de texto de HTML5 con el resultado
         document.writeln( "<h1>El producto es " + resultado + "</h1>" );
      </script>
   </head><body></body>
</html>
