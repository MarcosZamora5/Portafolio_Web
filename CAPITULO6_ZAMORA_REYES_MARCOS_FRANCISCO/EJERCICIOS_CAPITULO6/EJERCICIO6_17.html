<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Ejercicio 6.17</title>
    <script>
        var num1 = parseInt(window.prompt("Escriba el primer entero:", "0"));
        var num2 = parseInt(window.prompt("Escriba el segundo entero:", "0"));

        if (num1 > num2) {
            document.writeln("<h1>" + num1 + " es mayor que " + num2 + "</h1>");
        }
        if (num2 > num1) {
            document.writeln("<h1>" + num2 + " es mayor que " + num1 + "</h1>");
        }
        if (num1 == num2) {
            document.writeln("<h1>Estos números son iguales</h1>");
        }
    </script>
</head>
<body></body>
</html>
