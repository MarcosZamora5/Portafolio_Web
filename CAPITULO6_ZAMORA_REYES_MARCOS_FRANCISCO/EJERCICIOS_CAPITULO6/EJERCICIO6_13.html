    <h2>6.13 Dada y = ax³ + 7, ¿cuáles de las siguientes instrucciones de JavaScript son correctas para esta ecuación?</h2>

    <ul>
        <li><span class="respuesta">a) y = a * x * x * x + 7;</span></li>
        <li><span class="respuesta">d) y = ( a * x ) * x * x + 7;</span></li>
        <li><span class="respuesta">e) y = a * ( x * x * x ) + 7;</span></li>
    </ul>
