<!-- Ejercicio 19 -->

<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Ejercicio 6.19</title>
    <script>
        var radio = parseFloat(window.prompt("Escriba el radio del círculo:", "0"));
        
        var diametro = 2 * radio;
        var circunferencia = 2 * Math.PI * radio;
        var area = Math.PI * radio * radio;

        document.writeln("<h1>Resultados del círculo</h1>");
        document.writeln("<p>Diámetro: " + diametro + "</p>");
        document.writeln("<p>Circunferencia: " + circunferencia + "</p>");
        document.writeln("<p>Área: " + area + "</p>");
    </script>
</head>
<body></body>
</html>
