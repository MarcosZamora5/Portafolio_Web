<!DOCTYPE html>
<!-- Fig. 2.15: Formulario2.html -->
<!-- Formulario que usa una variedad de componentes. --> 
<html>
<head>
    <meta charset="utf-8">
    <title> Más formularios </title>
</head>
<body>
    <h1> Formulario de retroalimentación </h1>
    <p> Llene este formulario para ayudarnos a mejorar nuestro sitio. </p>
    
    <form method="post" action="http://www.deitel.com">
        <input type="hidden" name="destinatario" value="deitel@deitel.com">
        <input type="hidden" name="asunto" value="Formulario de retroalimentación">
        <input type="hidden" name="redirigir" value="principal.html">
        
        <p>
            <label> Nombre:
                <input name="nombre" type="text" size="25">
            </label>
        </p>
        
        <!-- <Textarea> crea un cuadro de texto multilínea -->
        <p>
            <label> Comentarios: <br>
                <textarea name="comentarios" rows="4" cols="36"> Escriba aquí los comentarios. </textarea>
            </label>
        </p>
        
        <!-- <Input type="password"> inserta un -->
        <!-- Cuadro de texto que aparece enmascarado con -->
        <!-- Caracteres de asteriscos -->
        <p>
            <label> Dirección de correo electrónico:
                <input name="email" type="password" size="25">
            </label>
        </p>
        
        <p>
            <strong> Cosas que le gustaron: </strong><br>
            <label> Diseño del sitio
                <input name="cosasgustaron" type="checkbox" value="Diseno">
            </label>
            <label> Vínculos
                <input name="cosasgustaron" type="checkbox" value="Vinculos">
            </label>
            <label> Facilidad de uso
                <input name="cosasgustaron" type="checkbox" value="Facilidad">
            </label>
            <label> Imágenes
                <input name="cosasgustaron" type="checkbox" value="Imagenes">
            </label>
            <label> Código fuente
                <input name="cosasgustaron" type="checkbox" value="Codigo">
            </label>
        </p>
        
        <!-- <Input type="radio"> crea un botón de -->
        <!-- Opción. La diferencia entre botones de opción -->
        <!-- Y casillas de verificación es que sólo puede seleccionarse -->
        <!-- Un botón de opción en un grupo. -->
        <p>
            <strong> Cómo llegó a nuestro sitio: </strong><br>
            <label> Motor de búsqueda
                <input name="comositio" type="radio" value="motor_busqueda" checked>
            </label>
            <label> Vínculos desde otro sitio
                <input name="comositio" type="radio" value="vinculo">
            </label>
            <label> Sitio Web Deitel.com
                <input name="comositio" type="radio" value="deitel.com">
            </label>
            <label> Referencia en un libro
                <input name="comositio" type="radio" value="libro">
            </label>
            <label> Otro
                <input name="comositio" type="radio" value="otro">
            </label>
        </p>
        
        <p>
            <label> Califique nuestro sitio:
                <!-- La etiqueta <select> presenta una lista -->
                <!-- Desplegable con opciones indicadas por las -->
                <!-- Etiquetas <option> -->
                <select name="calificacion">
                    <option selected> Sorprendente </option>
                    <option>10</option>
                    <option>9</option>
                    <option>8</option>
                    <option>7</option>
                    <option>6</option>
                    <option>5</option>
                    <option>4</option>
                    <option>3</option>
                    <option>2</option>
                    <option>1</option>
                    <option>Malo</option>
                </select>
            </label>
            </p>
        
            <p>
                <input type="submit" value="Enviar">
                <input type="reset" value="Borrar">
            </p>
        </form>
    </body>
        <p>
            <a href="../../index.html">Inicio</a>
        </p>
</html>
