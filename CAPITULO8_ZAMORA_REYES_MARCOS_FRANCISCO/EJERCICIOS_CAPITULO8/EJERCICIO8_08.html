<!DOCTYPE html>
<!-- Ejercicio 8.8: EJERCICIO8_08.html -->
<!-- Interés compuesto con tasas de interés del 5 al 10 por ciento. -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Interés compuesto - Tasas del 5% al 10%</title>
      <style type = "text/css">
         table  { width: 310px; border-collapse: collapse; background-color: lightblue; margin-bottom: 20px; }
         table, th, td { border: 1px solid black; padding: 4px; text-align: right; }
         th     { background-color: darkblue; color: white; }
      </style>
   </head>
   <body>
      <h1>Cálculo de Interés Compuesto (5% a 10%)</h1>
      <script>
         var monto;
         var principal = 1000.00;

         // Ciclo for para variar la tasa de interés del 5% al 10% (0.05 a 0.10)
         for ( var tasa = 0.05; tasa <= 0.10; tasa += 0.01 )
         {
            var porcentajeTasa = ( tasa * 100 ).toFixed( 0 );
            
            document.writeln( "<h3>Tasa de interés: " + porcentajeTasa + "%</h3>" );
            document.writeln( "<table>" );
            document.writeln( "<thead><tr><th>Año</th><th>Monto en depósito</th></tr></thead>" );
            document.writeln( "<tbody>" );

            for ( var anio = 1; anio <= 10; ++anio )
            {
               monto = principal * Math.pow( 1.0 + tasa, anio );
               document.writeln( "<tr><td>" + anio + "</td><td>" + monto.toFixed( 2 ) + "</td></tr>" );
            }

            document.writeln( "</tbody>" );
            document.writeln( "</table>" );
         }
      </script>
   </body>
</html>
