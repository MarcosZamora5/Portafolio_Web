<!DOCTYPE html>
<!-- Ejercicio 7.17: ej07_17.html -->
<!-- Encontrar los dos valores más grandes de 10 números introducidos. -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Ejercicio 7.17 - Los dos valores más grandes</title>
      <script>
         var contador = 2;
         var numero;
         var mayor1;
         var mayor2;

         mayor1 = parseInt( window.prompt( "Escriba el número 1 (de 10):", "0" ) );
         numero = parseInt( window.prompt( "Escriba el número 2 (de 10):", "0" ) );

         if ( numero > mayor1 )
         {
            mayor2 = mayor1;
            mayor1 = numero;
         }
         else
         {
            mayor2 = numero;
         }

         while ( contador < 10 )
         {
            ++contador;
            numero = parseInt( window.prompt( "Escriba el número " + contador + " (de 10):", "0" ) );

            if ( numero > mayor1 )
            {
               mayor2 = mayor1;
               mayor1 = numero;
            }
            else if ( numero > mayor2 )
            {
               mayor2 = numero;
            }
         } // fin de while

         document.writeln( "<h1>El número más grande es: " + mayor1 + "</h1>" );
         document.writeln( "<h2>El segundo número más grande es: " + mayor2 + "</h2>" );
      </script>
   </head>
   <body></body>
</html>
