<!-- Ejercicio 7.2 -->

<!DOCTYPE html>
<html>
   <head>
      <meta charset = "utf-8">
      <title>Ejercicio de autoevaluación 7.2</title>
   </head>
   <body>
      <h2>7.2 Escriba cuatro instrucciones de JavaScript que sumen 1, cada una, a la variable x, que contiene un número.</h2>
      <p><strong>Respuesta:</strong></p>
      <pre>
x = x + 1;
x += 1;
++x;
x++;
      </pre>
   </body>
</html>
