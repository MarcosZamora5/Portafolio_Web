<!DOCTYPE html>
<!-- Ejercicio 7.22: ej07_22.html -->
<!-- Cifrado de un entero de cuatro dígitos. -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Ejercicio 7.22 - Cifrar entero de 4 dígitos</title>
      <script>
         var entrada;
         var numero;
         var d1, d2, d3, d4;
         var temp;
         var cifrado;

         entrada = window.prompt( "Introduzca un entero de cuatro dígitos para cifrar:", "1234" );
         numero = parseInt( entrada );

         // Extraer cada dígito
         d1 = Math.floor( numero / 1000 );
         d2 = Math.floor( ( numero % 1000 ) / 100 );
         d3 = Math.floor( ( numero % 100 ) / 10 );
         d4 = numero % 10;

         // Reemplazar cada dígito con (dígito + 7) % 10
         d1 = ( d1 + 7 ) % 10;
         d2 = ( d2 + 7 ) % 10;
         d3 = ( d3 + 7 ) % 10;
         d4 = ( d4 + 7 ) % 10;

         // Intercambiar el primer dígito con el tercero
         temp = d1;
         d1 = d3;
         d3 = temp;

         // Intercambiar el segundo dígito con el cuarto
         temp = d2;
         d2 = d4;
         d4 = temp;

         // Formar cadena para conservar ceros a la izquierda (ej. 0189)
         cifrado = "" + d1 + d2 + d3 + d4;

         document.writeln( "<h1>Datos Cifrados</h1>" );
         document.writeln( "<p>Número original: " + entrada + "</p>" );
         document.writeln( "<p><strong>Entero cifrado: " + cifrado + "</strong></p>" );
      </script>
   </head>
   <body></body>
</html>
