<!DOCTYPE html>

<!-- Ejercicio 7.10: ej07_10.html -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Secuencia de comandos misteriosa</title>
      <script>

         var y;
         var x = 1;
         var total = 0;

         while ( x <= 10 )
         {
            y = x * x;
            document.writeln( "<p>" + y + "</p>" );
            total += y;
            ++x;
         } // fin de while

         document.writeln( "<p>El total es " + total + "</p>" );

      </script>
   </head>
   <body>
      <hr>
      <h3>7.10 Sin ejecutarla, determine lo que imprime esta secuencia de comandos:</h3>
      <p><strong>Respuesta:</strong> Imprime en párrafos separados los cuadrados de los números enteros del 1 al 10 (<code>1, 4, 9, 16, 25, 36, 49, 64, 81, 100</code>) y al final imprime la suma total de dichos cuadrados: <code>El total es 385</code>.</p>
   </body>
</html>
