<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ejercicio 11.28 – Generador de crucigramas</title>
<style>
  :root { color-scheme: light dark; --ac: #0b6e6e; --bd: color-mix(in srgb, CanvasText 25%, transparent); }
  body { font: 16px/1.5 Georgia, serif; max-width: 760px; margin: 0 auto; padding: 1rem; }
  h1 { font-size: 1.4rem; }
  nav { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: 1rem; }
  button { font: inherit; padding: .4rem .8rem; border: 1px solid var(--bd); background: Canvas; color: CanvasText; border-radius: 6px; cursor: pointer; }
  button.on, button.go { background: var(--ac); color: #fff; border-color: var(--ac); }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--ac); outline-offset: 2px; }
  input { font: inherit; padding: .4rem; width: 100%; box-sizing: border-box; border: 1px solid var(--bd); border-radius: 6px; margin: .4rem 0; background: Canvas; color: CanvasText; }
  section { display: none; } section.on { display: block; }
  .out { padding: .6rem .8rem; border-left: 4px solid var(--ac); background: color-mix(in srgb, var(--ac) 10%, transparent); margin-top: .6rem; min-height: 1.5rem; }
  table.cw { border-collapse: collapse; margin: .8rem 0; }
  .cw td { width: 32px; height: 32px; border: 1px solid CanvasText; position: relative; text-align: center; font: bold 1rem monospace; padding: 0; }
  .cw td.v { border: 0; }
  .cw sup { position: absolute; top: 1px; left: 2px; font-size: .55rem; font-weight: normal; }
  .scroll { overflow-x: auto; }
</style>
</head>
<body>
<h1>Ejercicio 11.28: Generador de crucigramas</h1>
<section class="on" id="s28">
  <p>Genera un crucigrama con palabras del diccionario. La versión en blanco muestra números y pistas; la solución muestra las letras.</p>
  <button class="go" id="b28">Generar nuevo</button>
  <button id="b28s">Mostrar / ocultar solución</button>
  <div class="scroll" id="grid"></div>
  <div id="pistas"></div>
</section>
<script>
/* ============ 11.28 Generador de crucigramas ============ */
const diccionarioCW = [
  { w: "PROGRAMA", p: "Conjunto de instrucciones que ejecuta una computadora" },
  { w: "CADENA", p: "Secuencia de caracteres" },
  { w: "ARREGLO", p: "Estructura que guarda varios valores por índice" },
  { w: "TECLADO", p: "Dispositivo para escribir" },
  { w: "PANTALLA", p: "Muestra la salida visual" },
  { w: "VARIABLE", p: "Espacio con nombre para guardar un dato" },
  { w: "FUNCION", p: "Bloque de código reutilizable" },
  { w: "CICLO", p: "Repite instrucciones" },
  { w: "OBJETO", p: "Instancia con propiedades y métodos" },
  { w: "METODO", p: "Función que pertenece a un objeto" },
  { w: "LETRA", p: "Cada carácter del alfabeto" },
  { w: "CHEQUE", p: "Documento para pagar con fondos de una cuenta" },
  { w: "ERROR", p: "Fallo en un programa" },
  { w: "DATO", p: "Valor que procesa un programa" }
];
const N = 31;
let colocadas = [], mostrarSol = false;

function puedeColocar(g, w, r, c, d) {
  const dr = d === "H" ? 0 : 1, dc = d === "H" ? 1 : 0;
  const fin = [r + dr * w.length, c + dc * w.length], ini = [r - dr, c - dc];
  if (r < 0 || c < 0 || r + dr * (w.length - 1) >= N || c + dc * (w.length - 1) >= N) return -1;
  if ((g[ini[0]]?.[ini[1]]) || (g[fin[0]]?.[fin[1]])) return -1;
  let cruces = 0;
  for (let i = 0; i < w.length; i++) {
    const rr = r + dr * i, cc = c + dc * i, cel = g[rr][cc];
    if (cel) { if (cel !== w[i]) return -1; cruces++; }
    else if (g[rr + dc]?.[cc + dr] || g[rr - dc]?.[cc - dr]) return -1; // vecinos laterales
  }
  return cruces;
}
function generar() {
  const g = Array.from({ length: N }, () => Array(N).fill(""));
  const pool = [...diccionarioCW].sort(() => Math.random() - .5).slice(0, 10).sort((a, b) => b.w.length - a.w.length);
  colocadas = [];
  const poner = (e, r, c, d) => {
    for (let i = 0; i < e.w.length; i++) g[r + (d === "V") * i][c + (d === "H") * i] = e.w[i];
    colocadas.push({ ...e, r, c, d });
  };
  poner(pool[0], 15, 15 - (pool[0].w.length >> 1), "H");
  for (const e of pool.slice(1)) {
    let mejor = null, max = 0;
    for (const d of ["H", "V"]) for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const k = puedeColocar(g, e.w, r, c, d);
      if (k > max) { max = k; mejor = [r, c, d]; }
    }
    if (mejor) poner(e, ...mejor);
  }
  dibujar(g);
}
function dibujar(g) {
  const rs = colocadas.map(x => x.r), cs = colocadas.map(x => x.c);
  const r0 = Math.min(...rs), c0 = Math.min(...cs);
  const r1 = Math.max(...colocadas.map(x => x.r + (x.d === "V") * (x.w.length - 1)));
  const c1 = Math.max(...colocadas.map(x => x.c + (x.d === "H") * (x.w.length - 1)));
  const orden = [...colocadas].sort((a, b) => a.r - b.r || a.c - b.c);
  const nums = {}; let n = 0;
  for (const x of orden) { const k = x.r + "," + x.c; if (!nums[k]) nums[k] = ++n; x.n = nums[k]; }
  let h = '<table class="cw" aria-label="Crucigrama">';
  for (let r = r0; r <= r1; r++) {
    h += "<tr>";
    for (let c = c0; c <= c1; c++) {
      const l = g[r][c], num = nums[r + "," + c];
      h += l ? `<td>${num ? `<sup>${num}</sup>` : ""}${mostrarSol ? l : ""}</td>` : '<td class="v"></td>';
    }
    h += "</tr>";
  }
  document.getElementById("grid").innerHTML = h + "</table>";
  const lista = d => orden.filter(x => x.d === d).sort((a, b) => a.n - b.n)
    .map(x => `<li value="${x.n}">${x.p} (${x.w.length} letras)</li>`).join("");
  document.getElementById("pistas").innerHTML =
    `<h3>Horizontales</h3><ol>${lista("H")}</ol><h3>Verticales</h3><ol>${lista("V")}</ol>`;
  window._g = g;
}
document.getElementById("b28").onclick = generar;
document.getElementById("b28s").onclick = () => { mostrarSol = !mostrarSol; dibujar(window._g); };
generar();
</script>
</body>
</html>
