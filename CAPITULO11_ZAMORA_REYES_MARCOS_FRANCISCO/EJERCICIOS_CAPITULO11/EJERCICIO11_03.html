<!DOCTYPE html>
<html lang="es">
<head>
   <meta charset="utf-8">
   <title>Ejercicio 11.3 - Biblioteca Math</title>
   <script>
      function iniciar() {
         var salida = "Función\t\t\tArgumento(s)\tResultado\n";
         salida += "----------------------------------------------------\n";
         salida += "Math.abs(x)\t\t-7.5\t\t" + Math.abs(-7.5) + "\n";
         salida += "Math.ceil(x)\t\t9.2\t\t" + Math.ceil(9.2) + "\n";
         salida += "Math.cos(x)\t\t0\t\t" + Math.cos(0) + "\n";
         salida += "Math.exp(x)\t\t1\t\t" + Math.exp(1).toFixed(4) + "\n";
         salida += "Math.floor(x)\t\t9.8\t\t" + Math.floor(9.8) + "\n";
         salida += "Math.log(x)\t\t2.71828\t\t" + Math.log(Math.E).toFixed(4) + "\n";
         salida += "Math.max(x, y)\t\t12, 27\t\t" + Math.max(12, 27) + "\n";
         salida += "Math.min(x, y)\t\t12, 27\t\t" + Math.min(12, 27) + "\n";
         salida += "Math.pow(x, y)\t\t2, 10\t\t" + Math.pow(2, 10) + "\n";
         salida += "Math.round(x)\t\t9.75\t\t" + Math.round(9.75) + "\n";
         salida += "Math.sin(x)\t\t0\t\t" + Math.sin(0) + "\n";
         salida += "Math.sqrt(x)\t\t81\t\t" + Math.sqrt(81) + "\n";
         salida += "Math.tan(x)\t\t0\t\t" + Math.tan(0) + "\n";

         document.getElementById("areaResultados").value = salida;
      }
      window.addEventListener("load", iniciar, false);
   </script>
</head>
<body>
   <h2>Ejercicio 11.3 - Evaluación de métodos de Math</h2>
   <textarea id="areaResultados" rows="16" cols="65" readonly></textarea>
</body>
</html>
