<!DOCTYPE html>
<html>
   <head>
      <meta charset="utf-8">
      <title>Ejercicio 11.15 - Cadenas que comienzan con "b"</title>
      <script>
         function filtrarPalabras() {
            var entrada = document.getElementById("entrada").value;
            var palabras = entrada.split(" ");
            var resultado = [];

            for ( var i = 0; i < palabras.length; ++i ) {
               if ( palabras[ i ].toLowerCase().indexOf("b") === 0 ) {
                  resultado.push( palabras[ i ] );
               }
            }

            document.getElementById("salida").value = resultado.join("\n");
         }

         function iniciar() {
            document.getElementById("btnFiltrar").addEventListener("click", filtrarPalabras, false);
         }
         window.addEventListener("load", iniciar, false);
      </script>
   </head>
   <body>
      <h2>Ejercicio 11.15 - Palabras que comienzan con "b"</h2>
      <p>Introduzca varias palabras separadas por espacio:</p>
      <input id="entrada" type="text" size="60" value="barco casa bicicleta sol bosque nube bueno">
      <input id="btnFiltrar" type="button" value="Filtrar">
      <p>Palabras que comienzan con "b":</p>
      <textarea id="salida" rows="8" cols="50" readonly></textarea>
   </body>
</html>
