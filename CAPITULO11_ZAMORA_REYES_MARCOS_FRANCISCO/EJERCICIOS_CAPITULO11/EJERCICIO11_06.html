<!DOCTYPE html>
<html>
   <head>
      <meta charset="utf-8">
      <title>Ejercicio 11.6 - Comparación de dos cadenas</title>
      <script>
         function comparar() {
            var s1 = document.getElementById("cadena1").value;
            var s2 = document.getElementById("cadena2").value;
            var msg = "";

            if ( s1 === s2 ) {
               msg = "La primera cadena (<strong>\"" + s1 + "\"</strong>) es <strong>igual</strong> que la segunda (<strong>\"" + s2 + "\"</strong>).";
            } else if ( s1 < s2 ) {
               msg = "La primera cadena (<strong>\"" + s1 + "\"</strong>) es <strong>menor</strong> que la segunda (<strong>\"" + s2 + "\"</strong>).";
            } else {
               msg = "La primera cadena (<strong>\"" + s1 + "\"</strong>) es <strong>mayor</strong> que la segunda (<strong>\"" + s2 + "\"</strong>).";
            }
            document.getElementById("salida").innerHTML = "<p>" + msg + "</p>";
         }

         function iniciar() {
            document.getElementById("botonComparar").addEventListener("click", comparar, false);
         }
         window.addEventListener("load", iniciar, false);
      </script>
   </head>
   <body>
      <h2>Ejercicio 11.6 - Comparar dos objetos String</h2>
      <form action="#">
         <p><label>Primera cadena: <input id="cadena1" type="text" value="manzana"></label></p>
         <p><label>Segunda cadena: <input id="cadena2" type="text" value="naranja"></label></p>
         <input id="botonComparar" type="button" value="Comparar cadenas">
      </form>
      <div id="salida"></div>
   </body>
</html>
