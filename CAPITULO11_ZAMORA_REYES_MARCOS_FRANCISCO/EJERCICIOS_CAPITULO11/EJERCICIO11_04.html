<!DOCTYPE html>
<html>
   <head>
      <meta charset="utf-8">
      <title>Ejercicio 11.4 - Redondeo con Math.floor</title>
      <script>
         function redondearAEntero( numero ) {
            return Math.floor( numero + 0.5 );
         }
         function redondearADecimas( numero ) {
            return Math.floor( numero * 10 + 0.5 ) / 10;
         }
         function redondearACentesimas( numero ) {
            return Math.floor( numero * 100 + 0.5 ) / 100;
         }
         function redondearAMilesimas( numero ) {
            return Math.floor( numero * 1000 + 0.5 ) / 1000;
         }

         function procesar() {
            var x = parseFloat( document.getElementById("entrada").value );
            if ( isNaN(x) ) return;

            document.getElementById("salida").innerHTML =
               "<p>Valor original: <strong>" + x + "</strong></p>" +
               "<ul>" +
               "<li>Redondeado al entero más cercano: <strong>" + redondearAEntero(x) + "</strong></li>" +
               "<li>Redondeado a la décima más cercana: <strong>" + redondearADecimas(x) + "</strong></li>" +
               "<li>Redondeado a la centésima más cercana: <strong>" + redondearACentesimas(x) + "</strong></li>" +
               "<li>Redondeado a la milésima más cercana: <strong>" + redondearAMilesimas(x) + "</strong></li>" +
               "</ul>";
         }

         function iniciar() {
            document.getElementById("botonRedondear").addEventListener("click", procesar, false);
            procesar();
         }
         window.addEventListener("load", iniciar, false);
      </script>
   </head>
   <body>
      <h2>Ejercicio 11.4 - Redondear un número usando Math.floor</h2>
      <form action="#">
         <label>Número decimal:
            <input id="entrada" type="number" step="any" value="12.34567">
         </label>
         <input id="botonRedondear" type="button" value="Redondear">
      </form>
      <div id="salida"></div>
   </body>
</html>
