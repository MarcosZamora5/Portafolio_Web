<!DOCTYPE html>
<html lang="es">
   <head>
      <meta charset="utf-8">
      <title>Ejercicio 11.16</title>
      <script>
         function filtrarTerminacion() {
            var texto = document.getElementById("entrada").value;
            var palabras = texto.split(/\s+/);
            var filtradas = [];

            for (var i = 0; i < palabras.length; ++i) {
               var p = palabras[i];
               if (p.length >= 2 && p.substring(p.length - 2).toLowerCase() === "ed") {
                  filtradas.push(p);
               }
            }
            document.getElementById("salida").value = filtradas.join("\n");
         }

         function iniciar() {
            document.getElementById("btnFiltrar").addEventListener("click", filtrarTerminacion, false);
         }
         window.addEventListener("load", iniciar, false);
      </script>
   </head>
   <body>
      <h2>Ejercicio 11.16 - Cadenas que terminan con "ed"</h2>
      <p>Ingrese una serie de palabras separadas por espacios:</p>
      <input id="entrada" type="text" size="50" value="pared red arbol sed caminaron usted">
      <input id="btnFiltrar" type="button" value="Filtrar"><br><br>
      <textarea id="salida" rows="8" cols="50" readonly></textarea>
   </body>
</html>
