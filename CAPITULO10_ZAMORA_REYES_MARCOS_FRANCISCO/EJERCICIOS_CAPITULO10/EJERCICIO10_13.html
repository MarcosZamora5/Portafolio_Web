<!DOCTYPE html>
<html>
   <head>
      <meta charset="utf-8">
      <title>Ejercicio 10.13 - Orden de inicialización</title>
      <script>
         function iniciar() {
            var ventas = new Array( 3 );
            for ( var i = 0; i < 3; ++i ) {
               ventas[ i ] = new Array( 5 );
            }

            var orden = 1;
            var html = "<p>Orden en el que los elementos del arreglo <code>ventas</code> (3 × 5) se establecen en cero:</p>";
            html += "<table border='1' cellpadding='6' style='border-collapse:collapse;'><tbody>";

            for ( var fila = 0; fila < 3; ++fila ) {
               html += "<tr>";
               for ( var col = 0; col < 5; ++col ) {
                  ventas[ fila ][ col ] = 0;
                  html += "<td><strong>" + orden + "°:</strong> <code>ventas[" + fila + "][" + col + "] = 0</code></td>";
                  ++orden;
               }
               html += "</tr>";
            }
            html += "</tbody></table>";

            document.getElementById("salida").innerHTML = html;
         }
         window.addEventListener("load", iniciar, false);
      </script>
   </head>
   <body>
      <h2>Ejercicio 10.13 - Etiquetado del arreglo bidimensional ventas (3 × 5)</h2>
      <div id="salida"></div>
   </body>
</html>
