<!DOCTYPE html>
<!-- Ejercicio 9.24: EJERCICIO9_024.html -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>CAI con Monitoreo de Rendimiento (10 preguntas)</title>
      <script>
         var num1, num2, respuestaCorrecta;
         var preguntasContadas = 0;
         var respuestasCorrectasCount = 0;

         function iniciar()
         {
            document.getElementById( "btnEnviar" ).addEventListener( "click", verificarRespuesta, false );
            reiniciarCuestionario();
         }

         function reiniciarCuestionario()
         {
            preguntasContadas = 0;
            respuestasCorrectasCount = 0;
            document.getElementById( "resultadoFinal" ).innerHTML = "";
            document.getElementById( "formularioPregunta" ).style.display = "block";
            generarNuevaPregunta();
         }

         function generarNuevaPregunta()
         {
            num1 = Math.floor( Math.random() * 9 ) + 1;
            num2 = Math.floor( Math.random() * 9 ) + 1;
            respuestaCorrecta = num1 * num2;

            document.getElementById( "pregunta" ).innerHTML = "¿Cuánto es " + num1 + " por " + num2 + "? (Pregunta " + ( preguntasContadas + 1 ) + " de 10)";
            document.getElementById( "respuestaUsuario" ).value = "";
            document.getElementById( "retroalimentacion" ).innerHTML = "";
         }

         function obtenerRespuestaAleatoria( esCorrecta )
         {
            var selector = Math.floor( Math.random() * 4 ) + 1;
            var mensaje = "";

            if ( esCorrecta )
            {
               switch ( selector )
               {
                  case 1: mensaje = "Muy bien."; break;
                  case 2: mensaje = "Excelente."; break;
                  case 3: mensaje = "Buen trabajo."; break;
                  case 4: mensaje = "Siga así."; break;
               }
            }
            else
            {
               switch ( selector )
               {
                  case 1: mensaje = "No. Intente de nuevo."; break;
                  case 2: mensaje = "Equivocado. Trate una vez más."; break;
                  case 3: mensaje = "No se dé por vencido."; break;
                  case 4: mensaje = "No. Siga intentando."; break;
               }
            }
            return mensaje;
         }

         function verificarRespuesta()
         {
            var respuestaUser = parseInt( document.getElementById( "respuestaUsuario" ).value );
            var retro = document.getElementById( "retroalimentacion" );

            if ( isNaN( respuestaUser ) ) return;

            if ( respuestaUser === respuestaCorrecta )
            {
               retro.style.color = "green";
               retro.innerHTML = obtenerRespuestaAleatoria( true );
               respuestasCorrectasCount++;
            }
            else
            {
               retro.style.color = "red";
               retro.innerHTML = obtenerRespuestaAleatoria( false );
            }

            preguntasContadas++;

            if ( preguntasContadas < 10 )
            {
               setTimeout( generarNuevaPregunta, 1500 );
            }
            else
            {
               // Mostrar resultados finales tras 10 preguntas
               setTimeout( mostrarResultadosFinales, 1500 );
            }
         }

         function mostrarResultadosFinales()
         {
            document.getElementById( "formularioPregunta" ).style.display = "none";
            var porcentaje = ( respuestasCorrectasCount / 10 ) * 100;
            var mensajeFinal = "<h3>Cuestionario finalizado</h3>" +
               "<p>Respuestas correctas: " + respuestasCorrectasCount + " de 10</p>" +
               "<p>Porcentaje de aciertos: " + porcentaje + "%</p>";

            if ( porcentaje < 75 )
            {
               mensajeFinal += "<p style='color: red; font-weight: bold;'>Por favor, pida ayuda adicional a su instructor.</p>";
            }
            else
            {
               mensajeFinal += "<p style='color: green; font-weight: bold;'>¡Felicidades, está listo para el siguiente nivel!</p>";
            }

            mensajeFinal += '<p><input type="button" value="Intentar de nuevo" onclick="reiniciarCuestionario()"></p>';
            document.getElementById( "resultadoFinal" ).innerHTML = mensajeFinal;
         }

         window.addEventListener( "load", iniciar, false );
      </script>
   </head>
   <body>
      <div id = "formularioPregunta">
         <h2 id = "pregunta"></h2>
         <form action = "#">
            <p><input id = "respuestaUsuario" type = "number">
               <input id = "btnEnviar" type = "button" value = "Responder"></p>
         </form>
         <p id = "retroalimentacion" style = "font-weight: bold; font-size: 1.2em;"></p>
      </div>
      <div id = "resultadoFinal"></div>
   </body>
</html>
