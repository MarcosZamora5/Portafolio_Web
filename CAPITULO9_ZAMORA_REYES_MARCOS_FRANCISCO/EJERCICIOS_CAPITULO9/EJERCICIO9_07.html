<!DOCTYPE html>
<!-- Ejercicio 9.7: EJERCICIO9_07.html -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Área de un círculo</title>
      <script>
         function iniciar()
         {
            var boton = document.getElementById( "botonCalcular" );
            boton.addEventListener( "click", mostrarArea, false );
         }

         function mostrarArea()
         {
            var campoRadio = document.getElementById( "campoRadio" );
            var radio = parseFloat( campoRadio.value );
            var resultado = document.getElementById( "resultado" );
            resultado.innerHTML = "El área del círculo es: " + areaCirculo( radio );
         }

         function areaCirculo( r )
         {
            return Math.PI * Math.pow( r, 2 );
         }

         window.addEventListener( "load", iniciar, false );
      </script>
   </head>
   <body>
      <form action = "#">
         <p><label>Radio del círculo: 
            <input id = "campoRadio" type = "number" step = "any"></label>
            <input id = "botonCalcular" type = "button" value = "Calcular Área"></p>
      </form>
      <p id = "resultado"></p>
   </body>
</html>
