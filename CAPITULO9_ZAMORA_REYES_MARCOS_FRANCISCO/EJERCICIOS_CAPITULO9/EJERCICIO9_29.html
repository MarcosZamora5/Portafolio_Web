<!DOCTYPE html>
<!-- Ejercicio 9.29: EJERCICIO9_029.html -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Función recursiva de potencia</title>
      <script>
         function iniciar()
         {
            document.getElementById( "btnCalcular" ).addEventListener( "click", ejecutarPotencia, false );
         }

         // Función recursiva solicitada base^exponente
         function potencia( base, exponente )
         {
            if ( exponente === 1 ) // Caso base
            {
               return base;
            }
            else // Paso recursivo
            {
               return base * potencia( base, exponente - 1 );
            }
         }

         function ejecutarPotencia()
         {
            var b = parseInt( document.getElementById( "base" ).value );
            var e = parseInt( document.getElementById( "exponente" ).value );
            var res = potencia( b, e );

            document.getElementById( "resultado" ).innerHTML = b + " elevado a la " + e + " es: " + res;
         }

         window.addEventListener( "load", iniciar, false );
      </script>
   </head>
   <body>
      <form action = "#">
         <p><label>Base: <input id = "base" type = "number" min = "1"></label></p>
         <p><label>Exponente (>=1): <input id = "exponente" type = "number" min = "1"></label></p>
         <p><input id = "btnCalcular" type = "button" value = "Calcular Potencia Recursiva"></p>
      </form>
      <p id = "resultado" style = "font-weight: bold;"></p>
   </body>
</html>
