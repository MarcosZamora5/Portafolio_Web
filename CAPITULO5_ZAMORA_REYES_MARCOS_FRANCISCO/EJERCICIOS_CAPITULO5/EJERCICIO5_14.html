<!DOCTYPE html>

<!-- Eje. 5.14 -->

<html>
<head>
    <meta charset="utf-8">
    <title>Ejercicio 5.14</title>
    <style>
        img {
            width: 200px;
            margin: 20px;
            transition: transform 0.3s ease; /* Transición suave */
        }
        img:hover {
            transform: scale(1.2); /* Aumenta el tamaño por 20% */
        }
    </style>
</head>
<body>
    <img src="../src/computadora.jpg" alt="Imagen 1">
    <img src="../src/deitel.jpg" alt="Imagen 2">
    <img src="../src/borde.jpg" alt="Imagen 3">
    <img src="../src/oceano.jpg" alt="Imagen 4">
</body>
</html>
