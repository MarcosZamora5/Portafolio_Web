<!DOCTYPE html>

<!-- Eje. 5.6 -->

<html>
<head>
    <meta charset="utf-8">
    <title>Ejercicio 5.6</title>
    <style>
        div {
            width: 200px;
            height: 200px;
            margin: 40px;
            display: inline-block; /* Para ponerlas lado a lado */
        }
        .caja1 { 
            background-color: tomato; 
            box-shadow: 15px 15px 20px dimgrey; 
        }
        .caja2 { 
            background-color: gold; 
            box-shadow: -15px -15px 30px dimgrey; 
        }
        .caja3 { 
            background-color: mediumseagreen; 
            box-shadow: 15px 15px 10px dimgrey; 
        }
    </style>
</head>
<body>
    <div class="caja1"></div>
    <div class="caja2"></div>
    <div class="caja3"></div>
</body>
</html>
