 <!DOCTYPE html>

 <!-- Eje. 5.5 -->
  
<html>
<head>
    <meta charset="utf-8">
    <title>Ejercicio 5.5</title>
    <style>
        div {
            width: 100px;
            height: 100px;
            border: 3px solid black;
            margin-bottom: 20px;
            /* Flexbox para centrar el texto fácilmente */
            display: flex; 
            align-items: center;
            justify-content: center;
        }
        .caja1 {
            border-radius: 10px;
            background-color: lightgreen;
        }
        .caja2 {
            border-radius: 50px;
            background-color: lightcoral;
        }
        .caja3 {
            border-radius: 100px; /* Crea un círculo perfecto */
            background-color: lightblue;
        }
    </style>
</head>
<body>
    <div class="caja1"><b>10px</b></div>
    <div class="caja2"><b>50px</b></div>
    <div class="caja3"><b>100px</b></div>
</body>
</html>
