<!DOCTYPE html>

<!-- Eje. 5.11 -->

<html>
<head>
    <meta charset="utf-8">
    <title>Ejercicio 5.11</title>
    <style>
        #galeria { 
            position: relative; 
            width: 400px; 
            height: 300px; 
        }
        #galeria img {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            /* Tiempos solicitados */
            transition-property: opacity;
            transition-duration: 3s;
            transition-timing-function: linear;
        }
        /* Al pasar el cursor, la imagen superior se vuelve transparente revelando la de abajo */
        #img5:hover { opacity: 0; }
    </style>
</head>
<body>
    <p>Pasa el cursor sobre la imagen para fusionar.</p>
    <div id="galeria">
        <img id="img1" src="../src/dislike.png" alt="Foto 1">
        <img id="img2" src="../src/like.png" alt="Foto 2">
        <img id="img3" src="../src/nota.png" alt="Foto 3">
        <img id="img4" src="../src/borde.jpg" alt="Foto 4">
        <img id="img5" src="../src/oceano.jpg" alt="Foto 5 ">
    </div>
</body>
</html>
