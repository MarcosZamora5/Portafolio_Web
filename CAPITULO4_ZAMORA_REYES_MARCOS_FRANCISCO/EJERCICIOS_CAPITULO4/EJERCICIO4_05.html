<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Ejercicio 4.5</title>
    <style type="text/css">
        /* Regla CSS solicitada */
        h1, h2 {
            padding: 0.5em;
            border-style: dashed;
            margin: 0.5em;
        }
    </style>
</head>
<body>
    <h1>Este es un encabezado h1 con borde dashed, relleno y margen de 0.5 ems.</h1>
    <h2>Este es un encabezado h2 que comparte las mismas propiedades.</h2>
    <p>Este es un párrafo normal que no se ve afectado por la regla CSS.</p>
</body>
</html>
